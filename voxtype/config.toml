engine = "parakeet"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[hotkey]
enabled = false

[parakeet]
model = "parakeet-unified-en-0.6b"
streaming = true
streaming_chunk_secs = 0.32
streaming_left_context_secs = 5.6
streaming_right_context_secs = 0.32

[output]
mode = "type"
