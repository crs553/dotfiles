# Shell
set-option -g default-shell /run/current-system/sw/bin/zsh

# Clock
set-option -g clock-mode-style 24

# Mouse
set-option -g mouse on

# Performance
set-option -sg escape-time 10

# Terminal
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Focus events
set-option -g focus-events on


# Catppuccin Mocha + Mauve 

# Catppuccin Mocha palette
set -g @rosewater "#f5e0e6"
set -g @flamingo  "#f2cdcd"
set -g @pink      "#f5c2e7"
set -g @mauve     "#cba6f7"
set -g @red       "#f38ba8"
set -g @maroon    "#eba0ac"
set -g @peach     "#fab387"
set -g @yellow    "#f9e2af"
set -g @green     "#a6e3a1"
set -g @teal      "#94e2d5"
set -g @sky       "#89dceb"
set -g @sapphire  "#74c7ec"
set -g @blue      "#89b4fa"
set -g @lavender  "#b4befe"

set -g @text      "#cdd6f4"
set -g @subtext1  "#bac2de"
set -g @subtext0  "#a6adc8"
set -g @overlay2  "#9399b2"
set -g @overlay1  "#7f849c"
set -g @overlay0  "#6c7086"

set -g @surface2  "#585b70"
set -g @surface1  "#45475a"
set -g @surface0  "#313244"
set -g @base      "#1e1e2e"
set -g @mantle    "#181825"
set -g @crust     "#11111b"



# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom

set -g status-left-length 80
set -g status-right-length 120

set -g status-style "bg=#{@base},fg=#{@text}"



# Left — session name
set -g status-left \
    "#[fg=#{@base},bg=#{@mauve},bold] #S #[fg=#{@mauve},bg=#{@base}]"


# Inactive windows
set -g window-status-format \
    "#[fg=#{@subtext0},bg=#{@surface0}] #I:#W #[fg=#{@surface0},bg=#{@base}]"

# Active window
set -g window-status-current-format \
    "#[fg=#{@base},bg=#{@mauve},bold] #I:#W #[fg=#{@mauve},bg=#{@base}]"

# Activity
setw -g window-status-activity-style \
    "fg=#{@peach},bg=#{@surface0},bold"

# Bell
setw -g window-status-bell-style \
    "fg=#{@base},bg=#{@red},bold"



# Right — date + time
set -g status-right "#[fg=#{@subtext0},bg=#{@surface0}] %a %d %b #[fg=#{@surface0},bg=#{@base}] #[fg=#{@base},bg=#{@mauve},bold] %H:%M #[fg=#{@mauve},bg=#{@base}]"



# Pane borders
set -g pane-border-style "fg=#{@surface1}"
set -g pane-active-border-style "fg=#{@mauve}"



# Messages / command prompt
set -g message-style "fg=#{@base},bg=#{@mauve},bold"
set -g message-command-style "fg=#{@text},bg=#{@surface0}"


# Clock mode
set -g clock-mode-colour "#cba6f7"
set -g clock-mode-style 24
